<style>
/* ═══════════════════════════════════════════════
   VENUECHECK — GLOBAL STYLES
═══════════════════════════════════════════════ */
:root {
  --midnight: #0f1624; --navy: #182236; --navy-light: #1e2d47;
  --gold: #c9a96e; --gold-light: #e0c28a; --champagne: #f5eedf;
  --text: #e8e2d8; --text-muted: #8a8478; --red: #c0392b; --green: #27796b;
  --border: rgba(201,169,110,0.2); --border-solid: #2a3a55;
  --radius: 4px; --radius-lg: 8px; --shadow: 0 4px 24px rgba(0,0,0,0.3);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'DM Sans', sans-serif; background: var(--midnight); color: var(--text); min-height: 100vh; font-size: 15px; line-height: 1.6; }
h1,h2,h3,h4 { font-family: 'Cormorant Garamond', serif; font-weight: 400; color: var(--champagne); }
a { color: var(--gold); text-decoration: none; cursor: pointer; }
.container { max-width: 1100px; margin: 0 auto; padding: 0 48px; }

/* BUTTONS */
.btn { display:inline-flex; align-items:center; justify-content:center; padding:11px 24px; border-radius:var(--radius); font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; letter-spacing:0.07em; text-transform:uppercase; cursor:pointer; border:none; transition:all 0.2s; white-space:nowrap; }
.btn-primary { background:var(--gold); color:var(--midnight); }
.btn-primary:hover { background:var(--gold-light); }
.btn-outline { background:transparent; color:var(--gold); border:1px solid var(--gold); }
.btn-outline:hover { background:var(--gold); color:var(--midnight); }
.btn-ghost { background:transparent; color:var(--text-muted); border:1px solid var(--border-solid); }
.btn-ghost:hover { color:var(--champagne); border-color:var(--text-muted); }
.btn-sm { padding:7px 16px; font-size:11px; }
.btn:disabled { opacity:0.5; cursor:not-allowed; }

/* FIELDS */
.field { display:flex; flex-direction:column; gap:7px; }
.field label { font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold); }
.field input,.field select,.field textarea { background:var(--navy-light); border:1px solid var(--border-solid); color:var(--champagne); padding:11px 14px; font-family:'DM Sans',sans-serif; font-size:14px; border-radius:var(--radius); outline:none; transition:border-color 0.2s; width:100%; }
.field input::placeholder,.field textarea::placeholder { color:var(--text-muted); }
.field input:focus,.field select:focus,.field textarea:focus { border-color:var(--gold); }
.field select option { background:var(--navy); }
.field textarea { resize:vertical; min-height:90px; }

/* MISC */
.card { background:var(--navy); border:1px solid var(--border); border-radius:var(--radius-lg); overflow:hidden; }
.badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; }
.badge-gold { background:rgba(201,169,110,0.15); color:var(--gold); border:1px solid var(--border); }
.section-divider { display:flex; align-items:center; gap:24px; margin:56px 0 40px; }
.section-divider::before,.section-divider::after { content:''; flex:1; height:1px; background:var(--border); }
.section-divider span { font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold); white-space:nowrap; }
.spinner { width:36px; height:36px; border:2px solid var(--border); border-top-color:var(--gold); border-radius:50%; animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.page-loading { display:flex; align-items:center; justify-content:center; min-height:60vh; }

/* NAV */
.nav { position:fixed; top:0; left:0; right:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:0 48px; height:68px; background:rgba(15,22,36,0.97); backdrop-filter:blur(10px); border-bottom:1px solid rgba(201,169,110,0.15); }
.nav-logo { font-family:'Cormorant Garamond',serif; font-size:21px; font-weight:300; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); cursor:pointer; }
.nav-logo span { color:var(--champagne); }
.nav-links { display:flex; align-items:center; gap:32px; list-style:none; }
.nav-link { color:var(--text-muted); font-size:13px; letter-spacing:0.06em; text-transform:uppercase; cursor:pointer; transition:color 0.2s; }
.nav-link:hover,.nav-link.active { color:var(--gold); }
.nav-right { display:flex; align-items:center; gap:12px; }
.nav-user { font-size:12px; color:var(--text-muted); }

/* CALENDAR */
.cal-wrapper { user-select:none; }
.cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.cal-month-label { font-family:'Cormorant Garamond',serif; font-size:20px; color:var(--champagne); }
.cal-nav-btn { background:var(--navy-light); border:1px solid var(--border-solid); color:var(--text); width:32px; height:32px; border-radius:var(--radius); cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; transition:border-color 0.2s; }
.cal-nav-btn:hover { border-color:var(--gold); }
.cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
.cal-day-name { text-align:center; font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); padding:6px 0; }
.cal-day { text-align:center; padding:9px 4px; font-size:13px; border-radius:var(--radius); border:1px solid transparent; transition:all 0.12s; cursor:pointer; }
.cal-day.empty,.cal-day.past { cursor:default; color:var(--text-muted); }
.cal-day.today { border-color:var(--gold); color:var(--gold); }
.cal-day.available:hover { background:var(--navy-light); border-color:var(--border-solid); }
.cal-day.booked { background:rgba(192,57,43,0.15); color:#e74c3c; cursor:not-allowed; text-decoration:line-through; }
.cal-day.selected { background:var(--gold); color:var(--midnight); font-weight:600; border-color:var(--gold); }
.cal-day.selecting { background:rgba(201,169,110,0.25); border-color:var(--gold); }
.cal-legend { display:flex; gap:20px; flex-wrap:wrap; margin-top:14px; }
.cal-legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); }
.cal-legend-dot { width:10px; height:10px; border-radius:2px; }

/* TOAST */
.toast-container { position:fixed; bottom:28px; right:28px; z-index:9999; display:flex; flex-direction:column; gap:10px; pointer-events:none; }
.toast { background:var(--navy); border:1px solid var(--border); color:var(--champagne); padding:14px 20px; border-radius:var(--radius-lg); font-size:14px; box-shadow:var(--shadow); animation:slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1); }
.toast.toast-error { border-color:rgba(231,76,60,0.5); color:#e74c3c; }
@keyframes slideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }

/* HERO */
.hero { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:120px 24px 80px; position:relative; overflow:hidden; }
.hero-glow { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(201,169,110,0.09) 0%,transparent 65%); }
.hero-eyebrow { font-size:11px; letter-spacing:0.28em; text-transform:uppercase; color:var(--gold); margin-bottom:26px; }
.hero h1 { font-size:clamp(48px,8vw,96px); font-weight:300; line-height:1.03; color:var(--champagne); margin-bottom:24px; }
.hero h1 em { font-style:italic; color:var(--gold); }
.hero-sub { max-width:520px; margin:0 auto 52px; color:var(--text-muted); font-size:16px; line-height:1.75; }
.search-box { background:var(--navy); border:1px solid var(--border); border-radius:10px; padding:36px 40px; max-width:780px; width:100%; text-align:left; }
.search-box h2 { font-size:18px; color:var(--champagne); margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border); }
.search-row { display:grid; grid-template-columns:1fr 1fr auto; gap:14px; align-items:end; }

/* VENUE CARDS */
.venue-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:24px; }
.venue-card { cursor:pointer; transition:border-color 0.2s, transform 0.2s; }
.venue-card:hover { border-color:var(--gold) !important; transform:translateY(-2px); }

/* HOW IT WORKS */
.how-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1px; background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
.how-step { background:var(--navy); padding:40px 32px; }
.how-num { font-family:'Cormorant Garamond',serif; font-size:52px; font-weight:300; color:rgba(201,169,110,0.2); line-height:1; margin-bottom:18px; }
.how-step h3 { font-size:22px; color:var(--champagne); margin-bottom:10px; }
.how-step p { font-size:13px; color:var(--text-muted); line-height:1.75; }

/* RESPONSIVE */
@media(max-width:768px){
  .nav{padding:0 20px;} .nav-links{display:none;}
  .container{padding:0 20px;}
  .search-row{grid-template-columns:1fr;}
  .how-grid{grid-template-columns:1fr; background:none; border:none; gap:16px;}
  .how-step{border:1px solid var(--border); border-radius:8px;}
}
</style>

<script type="text/babel">

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1oeWFxZnl6cXd3cGNlYnZ6aWNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyMTQyNjgsImV4cCI6MjA5Njc5MDI2OH0.woqxOaeJ1Ts2wE7RObSKbAHYQA0Ek6AoBl3zDDzKpQc';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ═══════════════════════════════════════════════════════
//  DB HELPERS
// ═══════════════════════════════════════════════════════
async function getVenues({ city='', date='' }={}) {
  let q = sb.from('venues').select('*, booked_dates(date)').eq('approved',true)
    .order('featured',{ascending:false}).order('created_at',{ascending:false});
  if(city) q = q.ilike('city',`%${city}%`);
  const {data,error} = await q;
  if(error) throw error;
  return (data||[]).map(v=>({
    ...v,
    bookedDates:(v.booked_dates||[]).map(b=>b.date),
    availableOnDate: date ? !(v.booked_dates||[]).some(b=>b.date===date) : null,
  }));
}
async function getVenueById(id) {
  const {data,error} = await sb.from('venues').select('*, booked_dates(date)').eq('id',id).single();
  if(error) throw error;
  return {...data, bookedDates:(data.booked_dates||[]).map(b=>b.date)};
}
async function getMyVenue(uid) {
  const {data,error} = await sb.from('venues').select('*, booked_dates(date)').eq('owner_id',uid).maybeSingle();
  if(error) throw error;
  if(!data) return null;
  return {...data, bookedDates:(data.booked_dates||[]).map(b=>b.date)};
}
async function createVenue(v, uid) {
  const slug = v.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'') + '-' + Date.now();
  const {data,error} = await sb.from('venues').insert([{...v,owner_id:uid,slug,approved:true}]).select().single();
  if(error) throw error; return data;
}
async function updateVenue(id, updates) {
  const {data,error} = await sb.from('venues').update(updates).eq('id',id).select().single();
  if(error) throw error; return data;
}
async function blockDates(venueId, dates) {
  const {error} = await sb.from('booked_dates').upsert(dates.map(date=>({venue_id:venueId,date})),{onConflict:'venue_id,date'});
  if(error) throw error;
  await touchCalendar(venueId);
}
async function unblockDate(venueId, date) {
  const {error} = await sb.from('booked_dates').delete().eq('venue_id',venueId).eq('date',date);
  if(error) throw error;
  await touchCalendar(venueId);
}
async function submitInquiry(payload) {
  const {error} = await sb.from('inquiries').insert([payload]);
  if(error) throw error;
}
async function getInquiries(venueId) {
  const {data,error} = await sb.from('inquiries').select('*').eq('venue_id',venueId).order('created_at',{ascending:false});
  if(error) throw error; return data||[];
}

// ═══════════════════════════════════════════════════════
//  HELPERS
// ═══════════════════════════════════════════════════════
function toDateStr(y,m,d){ return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function formatDate(str){
  if(!str) return '';
  const [y,m,d]=str.split('-');
  return new Date(+y,+m-1,+d).toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
}
function formatDateShort(str){
  if(!str) return '—';
  const [y,m,d]=str.split('-');
  return new Date(+y,+m-1,+d).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'});
}
const STYLE_EMOJIS={'Grand Ballroom':'🏛️','Rustic Barn':'🌾','Garden & Grounds':'🌿','Waterfront':'⚓','Urban Modern':'🌆','Luxury Estate':'🏰','Vineyard':'🍷','Rooftop':'🌃',default:'✨'};
const AMENITIES=['One Wedding at a Time','Ocean / Waterfront View','Countryside Setting','Mountain Views','Garden / Vineyard Setting','Outdoor Ceremony Space','Indoor Reception Hall','Open Bar Packages','In-House Catering','Outside Vendors Allowed','Bridal Suite','Groom\'s Quarters','On-Site Lodging','On-Site Parking','Valet Service','Wheelchair Accessible','Dance Floor','Live Music Friendly','AV / Sound System','Fireworks Allowed','Pet Friendly','On-Site Coordinator','Late-Night Receptions','Tables & Chairs Included'];

async function uploadVenuePhoto(venueId,file){
  if(file.size>5*1024*1024) throw new Error('Photo must be under 5MB.');
  const ext=file.name.split('.').pop();
  const path=`${venueId}/${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
  const {error}=await sb.storage.from('venue-photos').upload(path,file);
  if(error) throw error;
  const {data}=sb.storage.from('venue-photos').getPublicUrl(path);
  return data.publicUrl;
}
async function removeVenuePhoto(url){
  const path=url.split('/venue-photos/')[1];
  if(!path) return;
  await sb.storage.from('venue-photos').remove([decodeURIComponent(path)]);
}
async function markInquiry(id,status){
  const {error}=await sb.from('inquiries').update({status}).eq('id',id);
  if(error) throw error;
}
function isCalVerified(v){ return v&&v.calendar_updated_at&&(Date.now()-new Date(v.calendar_updated_at).getTime())<14*24*3600*1000; }
function getShortlist(){ try{return JSON.parse(localStorage.getItem('vc_shortlist')||'[]');}catch(e){return [];} }
function setShortlist(ids){ try{localStorage.setItem('vc_shortlist',JSON.stringify(ids));}catch(e){} }
function countOpenDays(venue,ym,dow){
  if(!ym) return 0;
  const [y,m]=ym.split('-').map(Number);
  const total=new Date(y,m,0).getDate();
  const now=new Date(); const floor=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let c=0;
  for(let d=1;d<=total;d++){
    const dt=new Date(y,m-1,d);
    if(dt<floor) continue;
    if(dow!=='any'&&dt.getDay()!==Number(dow)) continue;
    if(!(venue.bookedDates||[]).includes(toDateStr(y,m-1,d))) c++;
  }
  return c;
}
async function touchCalendar(venueId){ try{await sb.from('venues').update({calendar_updated_at:new Date().toISOString()}).eq('id',venueId);}catch(e){} }
async function joinWaitlist(payload){ const {error}=await sb.from('date_alerts').insert([payload]); if(error) throw error; }
async function getWaitlist(venueId){ const {data,error}=await sb.from('date_alerts').select('*').eq('venue_id',venueId).order('date'); if(error) throw error; return data||[]; }
async function requestTour(payload){ const {error}=await sb.from('tours').insert([payload]); if(error) throw error; }
async function getTours(venueId){ const {data,error}=await sb.from('tours').select('*').eq('venue_id',venueId).order('requested_at'); if(error) throw error; return data||[]; }
async function updateTour(id,updates){ const {error}=await sb.from('tours').update(updates).eq('id',id); if(error) throw error; }
async function logActivity(payload){ try{await sb.from('search_logs').insert([payload]);}catch(e){} }
async function getVenueViews(venueId){ try{ const since=new Date(Date.now()-7*864e5).toISOString(); const {count}=await sb.from('search_logs').select('*',{count:'exact',head:true}).eq('venue_id',venueId).eq('kind','view').gte('created_at',since); return count||0; }catch(e){return 0;} }
async function getCityDemand(city){ try{ const since=new Date(Date.now()-30*864e5).toISOString(); const {data}=await sb.from('search_logs').select('date').eq('kind','search').ilike('city',`%${city}%`).gte('created_at',since); return data||[]; }catch(e){return [];} }

// ═══════════════════════════════════════════════════════
//  TOAST
// ═══════════════════════════════════════════════════════
const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;
const ToastCtx = createContext(null);
function ToastProvider({children}){
  const [toasts,setToasts]=useState([]);
  const add=useCallback((msg,type='default')=>{
    const id=Date.now();
    setToasts(p=>[...p,{id,msg,type}]);
    setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),3500);
  },[]);
  return (
    <ToastCtx.Provider value={add}>
      {children}
      <div className="toast-container">
        {toasts.map(t=><div key={t.id} className={`toast${t.type==='error'?' toast-error':''}`}>{t.msg}</div>)}
      </div>
    </ToastCtx.Provider>
  );
}
function useToast(){ return useContext(ToastCtx)||((m)=>{}); }

// ═══════════════════════════════════════════════════════
//  AUTH CONTEXT
// ═══════════════════════════════════════════════════════
const AuthCtx = createContext(null);
function useAuth(){ return useContext(AuthCtx); }

// ═══════════════════════════════════════════════════════
//  CALENDAR COMPONENT
// ═══════════════════════════════════════════════════════
function Calendar({bookedDates=[],selectedDate=null,onSelect,selectingDates,onToggleDate,mode='single'}){
  const today=new Date();
  const [year,setYear]=useState(today.getFullYear());
  const [month,setMonth]=useState(today.getMonth());
  function nav(dir){ let m=month+dir,y=year; if(m>11){m=0;y++;} if(m<0){m=11;y--;} setMonth(m);setYear(y); }
  const firstDay=new Date(year,month,1).getDay();
  const totalDays=new Date(year,month+1,0).getDate();
  const todayStr=toDateStr(today.getFullYear(),today.getMonth(),today.getDate());
  const label=new Date(year,month).toLocaleString('default',{month:'long',year:'numeric'});
  function handleClick(ds,isPast,isBooked){
    if(isPast||isBooked) return;
    if(mode==='multi'&&onToggleDate){onToggleDate(ds);return;}
    if(mode==='single'&&onSelect) onSelect(ds);
  }
  return (
    <div className="cal-wrapper">
      <div className="cal-header">
        <span className="cal-month-label">{label}</span>
        <div style={{display:'flex',gap:6}}>
          <button className="cal-nav-btn" onClick={()=>nav(-1)}>‹</button>
          <button className="cal-nav-btn" onClick={()=>nav(1)}>›</button>
        </div>
      </div>
      <div className="cal-grid">
        {['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=><div key={d} className="cal-day-name">{d}</div>)}
        {Array.from({length:firstDay}).map((_,i)=><div key={`e${i}`} className="cal-day empty"/>)}
        {Array.from({length:totalDays}).map((_,i)=>{
          const d=i+1, ds=toDateStr(year,month,d);
          const date=new Date(year,month,d);
          const isPast=date<new Date(today.getFullYear(),today.getMonth(),today.getDate());
          const isBooked=bookedDates.includes(ds);
          const isSelected=mode==='single'&&selectedDate===ds;
          const isSelecting=mode==='multi'&&selectingDates&&selectingDates.has(ds);
          const isToday=ds===todayStr;
          let cls='cal-day';
          if(isPast) cls+=' past';
          else if(isBooked) cls+=' booked';
          else if(isSelected) cls+=' selected';
          else if(isSelecting) cls+=' selecting';
          else{ cls+=' available'; if(isToday) cls+=' today'; }
          return <div key={ds} className={cls} onClick={()=>handleClick(ds,isPast,isBooked)}>{d}</div>;
        })}
      </div>
      <div className="cal-legend">
        <div className="cal-legend-item"><div className="cal-legend-dot" style={{background:'var(--navy-light)',border:'1px solid var(--border-solid)'}}/>Available</div>
        <div className="cal-legend-item"><div className="cal-legend-dot" style={{background:'rgba(192,57,43,0.3)'}}/>Booked</div>
        {mode==='single'&&<div className="cal-legend-item"><div className="cal-legend-dot" style={{background:'var(--gold)'}}/>Your date</div>}

function VenueCard({venue,searchDate,onClick,openCount}){
  const emoji=STYLE_EMOJIS[venue.style]||STYLE_EMOJIS.default;
  const mainPhoto=(venue.photos&&venue.photos[0])||venue.photo_url;
  const [saved,setSaved]=useState(getShortlist().includes(venue.id));
  function toggleSave(e){
    e.stopPropagation();
    const list=getShortlist();
    const next=list.includes(venue.id)?list.filter(i=>i!==venue.id):[...list,venue.id];
    setShortlist(next); setSaved(!saved);
  }
  const isBooked=searchDate&&venue.bookedDates?.includes(searchDate);

        {hasDate&&<div style={{position:'absolute',top:12,right:12,padding:'4px 10px',borderRadius:20,fontSize:10,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',background:isBooked?'var(--red)':'var(--green)',color:'#fff'}}>{isBooked?'Unavailable':'Available'}</div>}
        {venue.featured&&<div style={{position:'absolute',top:12,left:12,padding:'3px 10px',borderRadius:20,fontSize:10,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',background:'rgba(201,169,110,0.9)',color:'var(--midnight)'}}>✦ Featured</div>}
        <button onClick={toggleSave} title={saved?'Remove from shortlist':'Save to shortlist'} style={{position:'absolute',bottom:12,right:12,width:34,height:34,borderRadius:'50%',border:'1px solid var(--border)',background:'rgba(15,22,36,0.85)',color:saved?'#e74c3c':'var(--text-muted)',fontSize:16,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>{saved?'♥':'♡'}</button>
      </div>

        <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:12}}>📍 {venue.city}, {venue.state}</div>
        <div style={{display:'flex',gap:14,fontSize:12,color:'var(--text-muted)',marginBottom:14,flexWrap:'wrap'}}>
          {venue.capacity&&<span>👥 Up to {venue.capacity.toLocaleString()}</span>}
          {venue.style&&<span>🎨 {venue.style}</span>}
          {venue.price_tier&&<span>{venue.price_tier}</span>}
          {isCalVerified(venue)&&<span style={{color:'#4ecdc4'}}>✓ Verified</span>}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8,paddingTop:12,borderTop:'1px solid var(--border)',fontSize:13}}>
          <div style={{width:8,height:8,borderRadius:'50%',flexShrink:0,background:typeof openCount==='number'?'#2ecc71':!hasDate?'var(--gold)':isBooked?'#e74c3c':'#2ecc71'}}/>
          <span style={{color:typeof openCount==='number'?'var(--champagne)':'var(--text-muted)'}}>{typeof openCount==='number'?`${openCount} matching date${openCount!==1?'s':''} open`:!hasDate?'View availability':isBooked?'Your date is taken':'Open on your date'}</span>
        </div>
      </div>
    </div>
  );
}

//  SEARCH PAGE
// ═══════════════════════════════════════════════════════
function SearchPage({initialParams,setPage,setSelectedVenueId}){
  const toast=useToast();
  const [date,setDate]=useState(initialParams?.date||'');
  const [city,setCity]=useState(initialParams?.city||'');
  const [guests,setGuests]=useState('');
  const [amenityFilter,setAmenityFilter]=useState([]);
  const [amenityOpen,setAmenityOpen]=useState(false);
  const [mode,setMode]=useState('exact');
  const [flexMonth,setFlexMonth]=useState('');
  const [flexDow,setFlexDow]=useState('6');
  function toggleFilterAmenity(a){setAmenityFilter(p=>p.includes(a)?p.filter(x=>x!==a):[...p,a]);}
  const [venues,setVenues]=useState([]);
  const [loading,setLoading]=useState(false);
  const [searched,setSearched]=useState(false);
  const todayStr=new Date().toISOString().split('T')[0];

  useEffect(()=>{
    if(initialParams?.date||initialParams?.city) runSearch(initialParams.date||'',initialParams.city||'');
  },[]);

  async function runSearch(d=date,c=city){
    setLoading(true); setSearched(true);
    try{
      let results=await getVenues({city:c,date:mode==='exact'?d:''});
      if(guests) results=results.filter(v=>!v.capacity||v.capacity>=parseInt(guests));
      if(amenityFilter.length) results=results.filter(v=>amenityFilter.every(a=>(v.amenities||[]).includes(a)));
      if(mode==='flexible'&&flexMonth){
        results=results.map(v=>({...v,openCount:countOpenDays(v,flexMonth,flexDow)})).filter(v=>v.openCount>0).sort((a,b)=>b.openCount-a.openCount||(b.featured||0)-(a.featured||0));
      }else{
        results.sort((a,b)=>{
          if(d){ if(a.availableOnDate&&!b.availableOnDate) return -1; if(!a.availableOnDate&&b.availableOnDate) return 1; }
          return (b.featured||0)-(a.featured||0);
        });
      }
      logActivity({kind:'search',city:c||null,date:(mode==='exact'&&d)||null});
      setVenues(results);
    }catch(err){ toast('Failed to load venues.','error'); }
    finally{ setLoading(false); }
  }

  const exactDate=mode==='exact'?date:'';
  const available=venues.filter(v=>!exactDate||v.availableOnDate);
  const booked=venues.filter(v=>exactDate&&!v.availableOnDate);
  const dowLabels={any:'days',6:'Saturdays',5:'Fridays',0:'Sundays'};
  const flexLabel=flexMonth?`${dowLabels[flexDow]} in ${new Date(flexMonth+'-01T00:00:00').toLocaleString('default',{month:'long',year:'numeric'})}`:'';

  return (
    <div style={{paddingTop:100,paddingBottom:80}}>
      <div style={{background:'var(--navy)',borderBottom:'1px solid var(--border)',padding:'28px 0',marginBottom:48}}>
        <div className="container">
          <form onSubmit={e=>{e.preventDefault();runSearch();}}>
            <div style={{display:'flex',gap:2,background:'var(--navy-light)',borderRadius:6,padding:3,width:'fit-content',marginBottom:14}}>
              {[['exact','📅 Exact Date'],['flexible',"✨ I'm Flexible"]].map(([m,l])=>(
                <button key={m} type="button" onClick={()=>setMode(m)} style={{padding:'7px 16px',borderRadius:4,fontSize:12,fontWeight:500,cursor:'pointer',border:'none',background:mode===m?'var(--gold)':'none',color:mode===m?'var(--midnight)':'var(--text-muted)'}}>{l}</button>
              ))}
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1.1fr 1.1fr 150px 190px auto',gap:14,alignItems:'end'}}>
              {mode==='exact'?(
                <div className="field"><label>Wedding Date</label><input type="date" value={date} min={todayStr} onChange={e=>setDate(e.target.value)}/></div>
              ):(
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
                  <div className="field"><label>Month</label><input type="month" value={flexMonth} min={todayStr.slice(0,7)} onChange={e=>setFlexMonth(e.target.value)}/></div>
                  <div className="field"><label>Day</label><select value={flexDow} onChange={e=>setFlexDow(e.target.value)}><option value="any">Any day</option><option value="6">Saturdays</option><option value="5">Fridays</option><option value="0">Sundays</option></select></div>
                </div>
              )}
              <div className="field"><label>City or State</label><input type="text" value={city} placeholder="e.g. Long Island, NY" onChange={e=>setCity(e.target.value)}/></div>
              <div className="field"><label>Min. Capacity</label>
                <select value={guests} onChange={e=>setGuests(e.target.value)}>
                  <option value="">Any size</option>
                  <option value="50">50+ guests</option>
                  <option value="100">100+ guests</option>
                  <option value="200">200+ guests</option>
                  <option value="300">300+ guests</option>
                </select>
              </div>
              <div className="field" style={{position:'relative'}}>
                <label>Must-Have Features</label>
                <button type="button" onClick={()=>setAmenityOpen(o=>!o)}
                  style={{background:'var(--navy-light)',border:`1px solid ${amenityFilter.length?'var(--gold)':'var(--border-solid)'}`,color:amenityFilter.length?'var(--gold)':'var(--champagne)',padding:'11px 14px',fontFamily:'DM Sans',fontSize:14,borderRadius:4,cursor:'pointer',display:'flex',justifyContent:'space-between',alignItems:'center',width:'100%',textAlign:'left'}}>
                  <span>{amenityFilter.length?`${amenityFilter.length} selected`:'Any features'}</span>
                  <span style={{fontSize:10,marginLeft:8}}>{amenityOpen?'▴':'▾'}</span>
                </button>
                {amenityOpen&&<div style={{position:'absolute',top:'calc(100% + 6px)',left:0,zIndex:50,background:'var(--navy)',border:'1px solid var(--border)',borderRadius:8,boxShadow:'var(--shadow)',width:300,maxHeight:320,display:'flex',flexDirection:'column'}}>
                  <div style={{overflowY:'auto',padding:'14px 16px',flex:1}}>
                    {AMENITIES.map(a=>(
                      <label key={a} style={{display:'flex',alignItems:'center',gap:9,fontSize:13,color:amenityFilter.includes(a)?'var(--champagne)':'var(--text-muted)',cursor:'pointer',padding:'5px 0'}}>
                        <input type="checkbox" checked={amenityFilter.includes(a)} onChange={()=>toggleFilterAmenity(a)} style={{width:'auto',accentColor:'#c9a96e',cursor:'pointer'}}/>
                        {a}
                      </label>
                    ))}
                  </div>
                  <div style={{display:'flex',gap:8,padding:'10px 16px',borderTop:'1px solid var(--border)'}}>
                    {amenityFilter.length>0&&<button type="button" onClick={()=>setAmenityFilter([])} style={{background:'none',border:'none',color:'var(--text-muted)',fontSize:12,cursor:'pointer',textDecoration:'underline'}}>Clear all</button>}
                    <button type="button" className="btn btn-primary btn-sm" style={{marginLeft:'auto'}} onClick={()=>setAmenityOpen(false)}>Done</button>
                  </div>
                </div>}
              </div>
              <button type="submit" className="btn btn-primary" style={{height:46}} disabled={loading}>{loading?'Searching…':'Search'}</button>
            </div>
          </form>
        </div>
      </div>
      <div className="container">
        {loading&&<div className="page-loading"><div className="spinner"/></div>}
        {!loading&&searched&&<>
          {amenityFilter.length>0&&<div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:20,alignItems:'center'}}>
            <span style={{fontSize:11,letterSpacing:'0.12em',textTransform:'uppercase',color:'var(--text-muted)'}}>Filtering by:</span>
            {amenityFilter.map(a=>(
              <span key={a} onClick={()=>{toggleFilterAmenity(a);}} style={{background:'rgba(201,169,110,0.12)',border:'1px solid var(--gold)',borderRadius:20,padding:'4px 12px',fontSize:12,color:'var(--gold)',cursor:'pointer'}} title="Click to remove">
                {a} ✕
              </span>
            ))}
          </div>}
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline',marginBottom:28}}>
            <h2 style={{fontSize:30}}>{mode==='flexible'&&flexMonth?`Venues with open ${flexLabel}`:exactDate?`Venues Available on ${formatDate(exactDate)}`:'All Venues'}</h2>
            <span style={{fontSize:13,color:'var(--text-muted)'}}>{mode==='flexible'&&flexMonth?`${venues.length} venue${venues.length!==1?'s':''} found`:exactDate?`${available.length} available · ${booked.length} unavailable`:`${venues.length} venue${venues.length!==1?'s':''}`}</span>
          </div>
          {venues.length===0?(
            <div style={{textAlign:'center',padding:'80px 20px'}}>
              <h3 style={{fontSize:28,color:'var(--champagne)',marginBottom:10}}>No venues found</h3>
              <p style={{color:'var(--text-muted)'}}>{amenityFilter.length?'No venues match all your must-have features. Try removing a filter or two.':'Try a different city or search without a date filter.'}</p>
            </div>
          ):<>
            <div className="venue-grid">{available.map(v=><VenueCard key={v.id} venue={v} searchDate={exactDate} openCount={v.openCount} onClick={()=>{setSelectedVenueId({id:v.id,date:exactDate});setPage('venue');}}/>)}</div>
            {booked.length>0&&<>
              <div style={{fontSize:11,letterSpacing:'0.18em',textTransform:'uppercase',color:'var(--text-muted)',margin:'36px 0 18px',paddingTop:28,borderTop:'1px solid var(--border)'}}>Unavailable on your date — but check other dates</div>
              <div className="venue-grid">{booked.map(v=><VenueCard key={v.id} venue={v} searchDate={exactDate} onClick={()=>{setSelectedVenueId({id:v.id,date:exactDate});setPage('venue');}}/>)}</div>
            </>}
          </>}
        </>}
        {!loading&&!searched&&<div style={{textAlign:'center',padding:'80px 20px'}}>
          <h3 style={{fontSize:28,color:'var(--champagne)',marginBottom:10}}>Search to see venues</h3>
          <p style={{color:'var(--text-muted)'}}>Enter a date or city above to find available wedding venues.</p>
        </div>}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
//  VENUE DETAIL PAGE
// ═══════════════════════════════════════════════════════
function VenuePage({venueInfo,setPage}){
  const toast=useToast();
  const [venue,setVenue]=useState(null);
  const [loading,setLoading]=useState(true);
  const [selectedDate,setSelectedDate]=useState(venueInfo?.date||'');
  const [sending,setSending]=useState(false);
  const [submitted,setSubmitted]=useState(false);
  const [form,setForm]=useState({couple_name:'',email:'',phone:'',guest_count:'',message:''});
  const [views,setViews]=useState(0);
  const [sideTab,setSideTab]=useState('inquiry');
  const [submittedKind,setSubmittedKind]=useState('inquiry');
  const [tourForm,setTourForm]=useState({date:'',time:'12:00',name:'',email:'',phone:''});
  const [tourSending,setTourSending]=useState(false);
  const [waitName,setWaitName]=useState('');
  const [waitEmail,setWaitEmail]=useState('');
  const [waitSending,setWaitSending]=useState(false);
  const [waitJoined,setWaitJoined]=useState(false);
  const [estGuests,setEstGuests]=useState('150');

  async function handleJoinWaitlist(){
    if(!waitEmail){toast('Please enter your email to join the waitlist.','error');return;}
    setWaitSending(true);
    try{
      await joinWaitlist({venue_id:venue.id,date:selectedDate,email:waitEmail,couple_name:waitName||null});
      setWaitJoined(true);
      toast(`✓ You're on the waitlist! ${venue.name} can reach out if this date opens.`);
    }catch(err){
      if(err.code==='23505') toast("You're already on the waitlist for this date!");
      else toast('Failed to join waitlist.','error');
    }finally{setWaitSending(false);}
  }

  async function handleTour(e){
    e.preventDefault();
    if(!tourForm.name||!tourForm.email||!tourForm.date){toast('Please fill in name, email, and a tour date.','error');return;}
    setTourSending(true);
    try{
      await requestTour({venue_id:venue.id,couple_name:tourForm.name,email:tourForm.email,phone:tourForm.phone||null,requested_at:new Date(`${tourForm.date}T${tourForm.time}:00`).toISOString()});
      setSubmittedKind('tour');
      setSubmitted(true);
      toast(`✓ Tour requested at ${venue.name}!`);
    }catch(err){toast('Failed to request tour.','error');}
    finally{setTourSending(false);}
  }

  useEffect(()=>{
    if(!venueInfo?.id) return;
    getVenueById(venueInfo.id).then(v=>{
      setVenue(v);
      logActivity({kind:'view',venue_id:v.id});
      getVenueViews(v.id).then(setViews);
    }).catch(()=>toast('Venue not found.','error')).finally(()=>setLoading(false));
  },[venueInfo]);

  function handleDateSelect(date){
    if(venue?.bookedDates?.includes(date)){toast('That date is already booked. Try another!','error');return;}
    setSelectedDate(date);
  }
  async function handleInquiry(e){
    e.preventDefault();
    if(!form.couple_name||!form.email){toast('Please enter your name and email.','error');return;}
    setSending(true);
    try{
      await submitInquiry({venue_id:venue.id,couple_name:form.couple_name,email:form.email,phone:form.phone||null,guest_count:form.guest_count?parseInt(form.guest_count):null,event_date:selectedDate||null,message:form.message||null});
      setSubmitted(true);
      toast(`✓ Inquiry sent to ${venue.name}!`);
    }catch(err){toast('Failed to send inquiry.','error');}
    finally{setSending(false);}
  }

  if(loading) return <div className="page-loading" style={{marginTop:80}}><div className="spinner"/></div>;
  if(!venue) return <div style={{textAlign:'center',paddingTop:140}}><h2>Venue not found</h2><button className="btn btn-outline" style={{marginTop:24}} onClick={()=>setPage('search')}>Back to Search</button></div>;

  const emoji=STYLE_EMOJIS[venue.style]||STYLE_EMOJIS.default;
  const heroPhoto=(venue.photos&&venue.photos[0])||venue.photo_url;
  const isDateBooked=selectedDate&&venue.bookedDates?.includes(selectedDate);
  const formattedDate=selectedDate?formatDate(selectedDate):null;

  return (
    <div style={{paddingTop:88,paddingBottom:80}}>
      <div style={{height:320,background:'var(--navy-light)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:80,overflow:'hidden'}}>
        {heroPhoto?<img src={heroPhoto} alt={venue.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:emoji}
      </div>
      <div className="container">
        <div style={{marginTop:14,marginBottom:8}}><span style={{fontSize:13,color:'var(--text-muted)',cursor:'pointer'}} onClick={()=>setPage('search')}>← Back to Search</span></div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 380px',gap:40,paddingTop:32,alignItems:'start'}}>
          {/* LEFT */}
          <div>
            <h1 style={{fontSize:'clamp(32px,5vw,52px)',fontWeight:300,marginBottom:6}}>{venue.name}</h1>

                      <div className="field"><label>Email</label><input type="email" placeholder="you@email.com" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} required/></div>

                        <div className="field"><label>Guest Count</label><input type="number" placeholder="150" value={form.guest_count} onChange={e=>setForm(f=>({...f,guest_count:e.target.value}))}/></div>

                    </div>

                  {sideTab==='tour'&&<>
                    <h4 style={{fontFamily:'Cormorant Garamond',fontSize:22,color:'var(--champagne)',marginBottom:6}}>Book a Tour</h4>

                      <div style={{display:'flex',flexDirection:'column',gap:12}}>
                        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                          <div className="field"><label>Tour Date</label><input type="date" min={new Date().toISOString().split('T')[0]} value={tourForm.date} onChange={e=>setTourForm(f=>({...f,date:e.target.value}))} required/></div>
                          <div className="field"><label>Time</label><select value={tourForm.time} onChange={e=>setTourForm(f=>({...f,time:e.target.value}))}>{['10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00','18:00'].map(t=><option key={t} value={t}>{t}</option>)}</select></div>
                        </div>
                        <div className="field"><label>Your Names</label><input value={tourForm.name} onChange={e=>setTourForm(f=>({...f,name:e.target.value}))} placeholder="Jane & Michael" required/></div>
                        <div className="field"><label>Email</label><input type="email" value={tourForm.email} onChange={e=>setTourForm(f=>({...f,email:e.target.value}))} placeholder="you@email.com" required/></div>
                        <div className="field"><label>Phone</label><input type="tel" value={tourForm.phone} onChange={e=>setTourForm(f=>({...f,phone:e.target.value}))} placeholder="(555) 000-0000"/></div>
                      </div>
                      <button type="submit" className="btn btn-primary" style={{width:'100%',marginTop:16}} disabled={tourSending}>{tourSending?'Requesting…':'Request This Tour Time'}</button>

              ):(
                <div style={{textAlign:'center',padding:'20px 0'}}>
                  <div style={{fontSize:40,marginBottom:12}}>✉️</div>
                  <h4 style={{color:'var(--champagne)',marginBottom:8,fontSize:22}}>{submittedKind==='tour'?'Tour Requested!':'Inquiry Sent!'}</h4>
                  <p style={{color:'var(--text-muted)',fontSize:13}}>{venue.name} will {submittedKind==='tour'?'confirm your tour time':'be in touch'} at {submittedKind==='tour'?tourForm.email:form.email}.</p>
                  <button className="btn btn-outline btn-sm" style={{marginTop:20}} onClick={()=>setPage('search')}>Browse More Venues</button>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

//  AUTH PAGE
// ═══════════════════════════════════════════════════════
function AuthPage({setPage}){
  const toast=useToast();
  const [mode,setMode]=useState('signin');
  const [email,setEmail]=useState('');
  const [password,setPassword]=useState('');
  const [loading,setLoading]=useState(false);
  async function handleSubmit(e){
    e.preventDefault(); setLoading(true);
    try{
      if(mode==='signin'){
        const {error}=await sb.auth.signInWithPassword({email,password});
        if(error) throw error;
        setPage('dashboard');
      }else{
        const {error}=await sb.auth.signUp({email,password});
        if(error) throw error;
        toast('Check your email to confirm your account, then sign in.');
        setMode('signin');
      }
    }catch(err){ toast(err.message||'Something went wrong.','error'); }
    finally{ setLoading(false); }
  }
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'80px 20px'}}>
      <div style={{background:'var(--navy)',border:'1px solid var(--border)',borderRadius:10,padding:48,width:'100%',maxWidth:420}}>
        <div style={{fontFamily:'Cormorant Garamond',fontSize:20,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--gold)',textAlign:'center',marginBottom:32,cursor:'pointer'}} onClick={()=>setPage('home')}>Venue<span style={{color:'var(--champagne)'}}>Check</span></div>
        <h2 style={{fontSize:28,textAlign:'center',marginBottom:6}}>{mode==='signin'?'Sign In':'Create Account'}</h2>
        <p style={{fontSize:13,color:'var(--text-muted)',textAlign:'center',marginBottom:32}}>{mode==='signin'?'Access your venue dashboard':'List your venue and start getting inquiries'}</p>
        <form onSubmit={handleSubmit} style={{display:'flex',flexDirection:'column',gap:18}}>
          <div className="field"><label>Email Address</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="you@venue.com" required/></div>
          <div className="field"><label>Password</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••" required minLength={8}/></div>
          <button type="submit" className="btn btn-primary" style={{marginTop:4}} disabled={loading}>{loading?'Please wait…':mode==='signin'?'Sign In':'Create Account'}</button>
        </form>
        <div style={{textAlign:'center',marginTop:24,fontSize:13,color:'var(--text-muted)'}}>
          {mode==='signin'?<>Don't have an account? <span style={{color:'var(--gold)',cursor:'pointer',textDecoration:'underline'}} onClick={()=>setMode('signup')}>Sign up free</span></>:<>Already have an account? <span style={{color:'var(--gold)',cursor:'pointer',textDecoration:'underline'}} onClick={()=>setMode('signin')}>Sign in</span></>}
        </div>
      </div>
    </div>
  );
}

//  REGISTER VENUE PAGE
// ═══════════════════════════════════════════════════════
const STYLES_LIST=['Grand Ballroom','Rustic Barn','Garden & Grounds','Waterfront','Urban Modern','Luxury Estate','Vineyard','Rooftop','Chapel','Country Club','Other'];
function RegisterVenuePage({setPage}){
  const toast=useToast();
  const {user}=useAuth();
  const [loading,setLoading]=useState(false);
  const [form,setForm]=useState({name:'',city:'',state:'',address:'',description:'',capacity:'',style:'',price_tier:'$$',price_min:'',price_per_guest:'',website:'',phone:'',email:'',amenities:[]});
  function upd(k,v){setForm(f=>({...f,[k]:v}));}
  function toggleAmenity(a){setForm(f=>({...f,amenities:f.amenities.includes(a)?f.amenities.filter(x=>x!==a):[...f.amenities,a]}));}
  async function handleSubmit(e){
    e.preventDefault();
    if(!form.name||!form.city||!form.state){toast('Venue name, city, and state are required.','error');return;}
    setLoading(true);
    try{
      await createVenue({name:form.name,city:form.city,state:form.state,address:form.address||null,description:form.description||null,capacity:form.capacity?parseInt(form.capacity):null,style:form.style||null,price_tier:form.price_tier||null,price_min:form.price_min?parseInt(form.price_min):null,price_per_guest:form.price_per_guest?parseInt(form.price_per_guest):null,website:form.website||null,phone:form.phone||null,email:form.email||user.email,amenities:form.amenities},user.id);
      toast('✓ Venue listed! Redirecting to dashboard…');
      setTimeout(()=>setPage('dashboard'),1200);
    }catch(err){toast(err.message||'Failed to create venue.','error');}
    finally{setLoading(false);}
  }
  return (
    <div style={{padding:'100px 0 80px'}}>
      <div className="container">
        <h1 style={{fontSize:42,marginBottom:8}}>List Your Venue</h1>
        <p style={{color:'var(--text-muted)',fontSize:15,marginBottom:36}}>Create your free listing and appear in couples' searches immediately.</p>
        <form onSubmit={handleSubmit} style={{background:'var(--navy)',border:'1px solid var(--border)',borderRadius:10,padding:40,maxWidth:700}}>
          {[['Basic Information',<>
            <div className="field" style={{marginBottom:16}}><label>Venue Name *</label><input type="text" value={form.name} onChange={e=>upd('name',e.target.value)} placeholder="e.g. Ashford Estate" required/></div>
            <div className="field" style={{marginBottom:16}}><label>Description</label><textarea value={form.description} onChange={e=>upd('description',e.target.value)} placeholder="Describe your venue — its setting, character, and what makes it special."/></div>
          </>],
          ['Location',<div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:16,marginBottom:16}}>
            <div className="field"><label>City *</label><input type="text" value={form.city} onChange={e=>upd('city',e.target.value)} placeholder="Long Island" required/></div>
            <div className="field"><label>State *</label><input type="text" value={form.state} onChange={e=>upd('state',e.target.value)} placeholder="NY" required/></div>
            <div className="field"><label>ZIP Code</label><input type="text" value={form.address} onChange={e=>upd('address',e.target.value)} placeholder="11786"/></div>
          </div>],
          ['Venue Details',<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16,marginBottom:16}}>
            <div className="field"><label>Venue Style</label><select value={form.style} onChange={e=>upd('style',e.target.value)}><option value="">Select style…</option>{STYLES_LIST.map(s=><option key={s} value={s}>{s}</option>)}</select></div>
            <div className="field"><label>Guest Capacity</label><input type="number" value={form.capacity} onChange={e=>upd('capacity',e.target.value)} placeholder="250"/></div>
            <div className="field"><label>Price Tier</label><select value={form.price_tier} onChange={e=>upd('price_tier',e.target.value)}>{['$','$$','$$$','$$$$'].map(p=><option key={p} value={p}>{p}</option>)}</select></div>
            <div className="field"><label>Starting Price ($)</label><input type="number" value={form.price_min} onChange={e=>upd('price_min',e.target.value)} placeholder="5000"/></div>
            <div className="field"><label>Price Per Guest ($)</label><input type="number" value={form.price_per_guest} onChange={e=>upd('price_per_guest',e.target.value)} placeholder="125"/></div>
          </div>],
          ['Key Features & Amenities',<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px 16px',marginBottom:16}}>
            {AMENITIES.map(a=><label key={a} style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--text-muted)',cursor:'pointer'}}><input type="checkbox" checked={form.amenities.includes(a)} onChange={()=>toggleAmenity(a)} style={{width:'auto',accentColor:'#c9a96e',cursor:'pointer'}}/>{a}</label>)}
          </div>],
          ['Contact Information',<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
            <div className="field"><label>Contact Email</label><input type="email" value={form.email} onChange={e=>upd('email',e.target.value)} placeholder={user?.email}/></div>
            <div className="field"><label>Phone Number</label><input type="tel" value={form.phone} onChange={e=>upd('phone',e.target.value)} placeholder="(631) 555-0100"/></div>
            <div className="field" style={{gridColumn:'span 2'}}><label>Website URL</label><input type="url" value={form.website} onChange={e=>upd('website',e.target.value)} placeholder="https://yourvenue.com"/></div>
          </div>]].map(([title,content])=>(
            <div key={title}>
              <div style={{fontSize:11,letterSpacing:'0.18em',textTransform:'uppercase',color:'var(--gold)',margin:'24px 0 16px',paddingTop:20,borderTop:'1px solid var(--border)'}}>{title}</div>
              {content}
            </div>
          ))}
          <button type="submit" className="btn btn-primary" style={{marginTop:28,width:'100%'}} disabled={loading}>{loading?'Creating your listing…':'Create My Free Listing'}</button>
        </form>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
//  DASHBOARD PAGE
// ═══════════════════════════════════════════════════════
function DashboardPage({setPage}){
  const toast=useToast();
  const {user}=useAuth();
  const [venue,setVenue]=useState(null);
  const [inquiries,setInquiries]=useState([]);
  const [tours,setTours]=useState([]);
  const [waitlist,setWaitlist]=useState([]);
  const [demand,setDemand]=useState([]);
  const [loading,setLoading]=useState(true);
  const [tab,setTab]=useState('calendar');
  const [selectingDates,setSelectingDates]=useState(new Set());
  const [saving,setSaving]=useState(false);
  const [profileForm,setProfileForm]=useState({});

  useEffect(()=>{
    if(!user) return;
    getMyVenue(user.id).then(async v=>{
      setVenue(v);
      if(v){
        setProfileForm({description:v.description||'',capacity:v.capacity||'',price_min:v.price_min||'',price_per_guest:v.price_per_guest||'',price_tier:v.price_tier||'$$',phone:v.phone||'',website:v.website||'',amenities:v.amenities||[]});
        const [inqs,trs,wl,dem]=await Promise.all([
          getInquiries(v.id).catch(()=>[]),
          getTours(v.id).catch(()=>[]),
          getWaitlist(v.id).catch(()=>[]),
          getCityDemand(v.city).catch(()=>[]),
        ]);
        setInquiries(inqs); setTours(trs); setWaitlist(wl); setDemand(dem);
      }
    }).catch(()=>toast('Failed to load dashboard.','error')).finally(()=>setLoading(false));
  },[user]);

  function toggleDate(date){ setSelectingDates(prev=>{ const n=new Set(prev); n.has(date)?n.delete(date):n.add(date); return n; }); }

  async function handleBlockDates(){
    if(!selectingDates.size){toast('Select dates to block first.','error');return;}
    setSaving(true);
    try{
      await blockDates(venue.id,Array.from(selectingDates));
      setVenue(v=>({...v,calendar_updated_at:new Date().toISOString(),bookedDates:[...new Set([...(v.bookedDates||[]),...Array.from(selectingDates)])]}));
      setSelectingDates(new Set());
      toast(`✓ ${selectingDates.size} date${selectingDates.size>1?'s':''} blocked`);
    }catch(err){toast('Failed to save dates.','error');}
    finally{setSaving(false);}
  }

  async function handleUnblock(date){
    try{
      await unblockDate(venue.id,date);
      setVenue(v=>({...v,bookedDates:v.bookedDates.filter(d=>d!==date)}));
      toast('Date unblocked');
    }catch(err){toast('Failed to unblock.','error');}
  }

  async function handleSaveProfile(e){
    e.preventDefault();
    try{
      const updated=await updateVenue(venue.id,{description:profileForm.description,capacity:profileForm.capacity?parseInt(profileForm.capacity):null,price_min:profileForm.price_min?parseInt(profileForm.price_min):null,price_per_guest:profileForm.price_per_guest?parseInt(profileForm.price_per_guest):null,price_tier:profileForm.price_tier,phone:profileForm.phone,website:profileForm.website,amenities:profileForm.amenities||[]});
      setVenue(v=>({...v,...updated}));
      toast('✓ Profile updated');
    }catch(err){toast('Failed to save.','error');}
  }

  const [uploading,setUploading]=useState(false);
  async function handlePhotoUpload(e){
    const files=Array.from(e.target.files||[]);
    if(!files.length) return;
    const current=venue.photos||[];
    if(current.length+files.length>5){toast('Maximum 5 photos. Remove some first.','error');e.target.value='';return;}
    setUploading(true);
    try{
      const urls=[];
      for(const f of files){ urls.push(await uploadVenuePhoto(venue.id,f)); }
      const newPhotos=[...current,...urls];
      await updateVenue(venue.id,{photos:newPhotos});
      setVenue(v=>({...v,photos:newPhotos}));
      toast(`✓ ${urls.length} photo${urls.length>1?'s':''} uploaded`);
    }catch(err){toast(err.message||'Upload failed.','error');}
    finally{setUploading(false);e.target.value='';}
  }
  async function handlePhotoDelete(url){
    try{
      await removeVenuePhoto(url);
      const newPhotos=(venue.photos||[]).filter(p=>p!==url);
      await updateVenue(venue.id,{photos:newPhotos});
      setVenue(v=>({...v,photos:newPhotos}));
      toast('Photo removed');
    }catch(err){toast('Failed to remove photo.','error');}
  }
  async function handleMakeMain(url){
    try{
      const newPhotos=[url,...(venue.photos||[]).filter(p=>p!==url)];
      await updateVenue(venue.id,{photos:newPhotos});
      setVenue(v=>({...v,photos:newPhotos}));
      toast('✓ Main photo updated');
    }catch(err){toast('Failed to update.','error');}
  }
  async function handleMarkRead(id){
    try{
      await markInquiry(id,'read');
      setInquiries(list=>list.map(i=>i.id===id?{...i,status:'read'}:i));
    }catch(err){toast('Failed to update.','error');}
  }
  async function handleTourStatus(id,status){
    try{
      await updateTour(id,{status});
      setTours(ts=>ts.map(t=>t.id===id?{...t,status}:t));
      toast(status==='confirmed'?'✓ Tour confirmed — send them a quick email too!':'Tour declined');
    }catch(err){toast('Failed to update tour.','error');}
  }
  function toggleProfileAmenity(a){
    setProfileForm(f=>({...f,amenities:(f.amenities||[]).includes(a)?f.amenities.filter(x=>x!==a):[...(f.amenities||[]),a]}));
  }

  if(loading) return <div className="page-loading" style={{marginTop:80}}><div className="spinner"/></div>;

  if(!venue) return (
    <div style={{textAlign:'center',paddingTop:140}}>
      <div style={{fontFamily:'Cormorant Garamond',fontSize:52,marginBottom:20}}>✦</div>
      <h2 style={{fontSize:32,marginBottom:10}}>No venue listed yet</h2>
      <p style={{color:'var(--text-muted)',marginBottom:32}}>Create your free listing to start showing couples your availability.</p>
      <button className="btn btn-primary" onClick={()=>setPage('register')}>List My Venue</button>
    </div>
  );

  const newInqCount=inquiries.filter(i=>i.status==='new').length;
  const pendingTours=tours.filter(t=>t.status==='pending').length;
  const dateCounts={};
  demand.forEach(r=>{ if(r.date) dateCounts[r.date]=(dateCounts[r.date]||0)+1; });
  const topDates=Object.entries(dateCounts).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([d])=>formatDateShort(d));

  return (
    <div style={{padding:'100px 0 80px'}}>
      <div className="container">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:28,flexWrap:'wrap',gap:16}}>
          <div>
            <h1 style={{fontSize:38,marginBottom:4}}>{venue.name}</h1>
            <div style={{fontSize:14,color:'var(--text-muted)'}}>📍 {venue.city}, {venue.state}</div>
            {isCalVerified(venue)
              ?<div style={{fontSize:12,color:'#4ecdc4',marginTop:6}}>✓ Calendar Verified — couples see this badge on your listing</div>
              :<div style={{fontSize:12,color:'var(--text-muted)',marginTop:6}}>Update your calendar to earn the ✓ Verified badge couples trust</div>}
          </div>
        </div>

        {/* Stats */}
        <div style={{display:'flex',gap:12,flexWrap:'wrap',marginBottom:28}}>
          {[[inquiries.length,'Total Inquiries'],[newInqCount,'New Inquiries'],[(venue.bookedDates||[]).length,'Dates Blocked'],[venue.plan||'Free','Current Plan']].map(([n,l])=>(
            <div key={l} style={{background:'var(--navy-light)',border:'1px solid var(--border-solid)',borderRadius:4,padding:'12px 18px',textAlign:'center'}}>
              <div style={{fontFamily:'Cormorant Garamond',fontSize:28,color:'var(--champagne)',lineHeight:1}}>{n}</div>
              <div style={{fontSize:11,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.08em',marginTop:4}}>{l}</div>
            </div>
          ))}
        </div>

        {/* Tabs */}
        <div style={{display:'flex',gap:2,background:'var(--navy)',border:'1px solid var(--border)',borderRadius:8,padding:4,width:'fit-content',marginBottom:32}}>
          {[['calendar',`📅 Manage Availability`],['photos','📸 Photos'],['tours',`🗓️ Tours${pendingTours>0?` (${pendingTours})`:''}`],['inquiries',`✉️ Inquiries${newInqCount>0?` (${newInqCount})`:''}`],['profile','✏️ Edit Profile']].map(([t,label])=>(
            <button key={t} onClick={()=>setTab(t)} style={{padding:'9px 20px',borderRadius:4,fontSize:13,fontWeight:500,letterSpacing:'0.05em',cursor:'pointer',border:'none',background:tab===t?'var(--gold)':'none',color:tab===t?'var(--midnight)':'var(--text-muted)',transition:'all 0.15s'}}>{label}</button>
          ))}
        </div>

        {/* CALENDAR TAB */}
        {tab==='calendar'&&<>
        {demand.length>0&&<div style={{background:'rgba(201,169,110,0.07)',border:'1px solid var(--border)',borderRadius:8,padding:'14px 20px',marginBottom:20,fontSize:13,color:'var(--champagne)',lineHeight:1.6}}>
          📈 <strong>{demand.length}</strong> couple{demand.length!==1?'s':''} searched for venues in {venue.city} in the last 30 days{topDates.length?<> · Most-wanted dates: <span style={{color:'var(--gold)'}}>{topDates.join(' · ')}</span></>:null}. Keep your calendar updated to capture them!
        </div>}
        <div style={{display:'grid',gridTemplateColumns:'1fr 340px',gap:28,alignItems:'start'}}>
          <div style={{background:'var(--navy)',border:'1px solid var(--border)',borderRadius:10,padding:28}}>
            <h3 style={{fontSize:22,marginBottom:8}}>Block Off Booked Dates</h3>
            <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:20}}>Click dates to mark them as booked. They'll show as unavailable to couples searching your venue.</p>
            <Calendar bookedDates={venue.bookedDates||[]} selectingDates={selectingDates} onToggleDate={toggleDate} mode="multi"/>
            <div style={{marginTop:20,display:'flex',gap:10,alignItems:'center'}}>
              <button className="btn btn-primary" onClick={handleBlockDates} disabled={saving||!selectingDates.size}>{saving?'Saving…':`Block ${selectingDates.size||''} Selected Date${selectingDates.size!==1?'s':''}`}</button>
              {selectingDates.size>0&&<button className="btn btn-ghost btn-sm" onClick={()=>setSelectingDates(new Set())}>Clear</button>}
            </div>
          </div>
          <div style={{background:'var(--navy)',border:'1px solid var(--border)',borderRadius:10,padding:24}}>
            <h4 style={{fontFamily:'Cormorant Garamond',fontSize:18,color:'var(--champagne)',marginBottom:16}}>Blocked Dates</h4>
            {!(venue.bookedDates||[]).length?(
              <p style={{color:'var(--text-muted)',fontSize:13}}>No dates blocked yet. Select dates on the calendar to mark them as booked.</p>
            ):[...(venue.bookedDates||[])].sort().map(d=>(
              <div key={d} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',borderBottom:'1px solid var(--border)',fontSize:13}}>
                <span style={{color:'var(--champagne)'}}>{formatDateShort(d)}</span>
                <button onClick={()=>handleUnblock(d)} style={{background:'none',border:'1px solid rgba(192,57,43,0.4)',color:'#e74c3c',padding:'3px 10px',borderRadius:4,fontSize:11,cursor:'pointer'}}>Unblock</button>
              </div>
            ))}
            {waitlist.length>0&&<div style={{marginTop:24,paddingTop:18,borderTop:'1px solid var(--border)'}}>
              <h4 style={{fontFamily:'Cormorant Garamond',fontSize:18,color:'var(--champagne)',marginBottom:8}}>💌 Date Waitlists</h4>
              <p style={{fontSize:12,color:'var(--text-muted)',marginBottom:10}}>Couples who want these dates if they open up — instant warm leads:</p>
              {waitlist.map(w=>(
                <div key={w.id} style={{fontSize:12,padding:'7px 0',borderBottom:'1px solid var(--border)'}}>
                  <span style={{color:'var(--gold)'}}>{formatDateShort(w.date)}</span> — <span style={{color:'var(--champagne)'}}>{w.couple_name||'A couple'}</span> <a href={`mailto:${w.email}`} style={{fontSize:11}}>({w.email})</a>
                </div>
              ))}
            </div>}
          </div>
        </div>
        </>}

        {/* PHOTOS TAB */}
        {tab==='photos'&&<div style={{maxWidth:760}}>
          <div style={{background:'var(--navy)',border:'1px solid var(--border)',borderRadius:10,padding:32}}>
            <h3 style={{fontSize:22,marginBottom:8}}>Venue Photos</h3>
            <p style={{fontSize:13,color:'var(--text-muted)',marginBottom:20}}>Upload up to 5 photos (max 5MB each). The first photo is your main listing image — couples see it first in search results.</p>
            <label className="btn btn-primary" style={{cursor:'pointer',marginBottom:24}}>
              {uploading?'Uploading…':'＋ Upload Photos'}
              <input type="file" accept="image/*" multiple onChange={handlePhotoUpload} disabled={uploading} style={{display:'none'}}/>
            </label>
            {!(venue.photos||[]).length?(
              <div style={{textAlign:'center',padding:'40px 20px',border:'1px dashed var(--border-solid)',borderRadius:8,marginTop:8}}>
                <div style={{fontSize:36,marginBottom:10}}>📸</div>
                <p style={{color:'var(--text-muted)',fontSize:13}}>No photos yet. Listings with photos get far more inquiries — add your best shots!</p>
              </div>
            ):(
              <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(180px,1fr))',gap:14,marginTop:8}}>
                {(venue.photos||[]).map((p,i)=>(
                  <div key={p} style={{position:'relative',borderRadius:8,overflow:'hidden',border:i===0?'2px solid var(--gold)':'1px solid var(--border)'}}>
                    <img src={p} alt={`Photo ${i+1}`} style={{width:'100%',height:130,objectFit:'cover',display:'block'}}/>
                    {i===0&&<div style={{position:'absolute',top:8,left:8,background:'var(--gold)',color:'var(--midnight)',fontSize:10,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',padding:'2px 8px',borderRadius:12}}>Main</div>}
                    <div style={{display:'flex',gap:1,background:'var(--navy-light)'}}>
                      {i!==0&&<button onClick={()=>handleMakeMain(p)} style={{flex:1,background:'none',border:'none',color:'var(--gold)',fontSize:11,padding:'8px 4px',cursor:'pointer'}}>Make Main</button>}
                      <button onClick={()=>handlePhotoDelete(p)} style={{flex:1,background:'none',border:'none',color:'#e74c3c',fontSize:11,padding:'8px 4px',cursor:'pointer'}}>Remove</button>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>}

        {/* INQUIRIES TAB */}
        {tab==='inquiries'&&<div>
          {!inquiries.length?(
            <div style={{textAlign:'center',padding:'60px 20px'}}>
              <div style={{fontSize:40,marginBottom:16}}>✉️</div>
              <h3 style={{fontSize:26,color:'var(--champagne)',marginBottom:8}}>No inquiries yet</h3>
              <p style={{color:'var(--text-muted)'}}>Share your listing to start getting inquiries from couples.</p>
            </div>
          ):<div style={{display:'flex',flexDirection:'column',gap:14}}>
            {inquiries.map(inq=>(
              <div key={inq.id} style={{background:'var(--navy)',border:`1px solid ${inq.status==='new'?'var(--gold)':'var(--border)'}`,borderLeft:inq.status==='new'?'3px solid var(--gold)':'1px solid var(--border)',borderRadius:8,padding:'20px 24px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8}}>
                  <div style={{fontFamily:'Cormorant Garamond',fontSize:20,color:'var(--champagne)'}}>{inq.couple_name}</div>
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    {inq.status==='new'&&<span className="badge badge-gold">New</span>}
                    <span style={{fontSize:11,color:'var(--text-muted)'}}>{new Date(inq.created_at).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}</span>
                  </div>
                </div>
                <div style={{display:'flex',gap:20,flexWrap:'wrap',fontSize:12,color:'var(--text-muted)',marginBottom:10}}>
                  <span>✉️ {inq.email}</span>
                  {inq.phone&&<span>📞 {inq.phone}</span>}
                  {inq.event_date&&<span>📅 {formatDateShort(inq.event_date)}</span>}
                  {inq.guest_count&&<span>👥 {inq.guest_count} guests</span>}
                </div>
                {inq.message&&<div style={{fontSize:13,color:'var(--text-muted)',background:'var(--navy-light)',borderRadius:4,padding:'10px 14px',marginBottom:12}}>{inq.message}</div>}
                <div style={{display:'flex',gap:10}}>
                  <a href={`mailto:${inq.email}?subject=Your inquiry about ${venue.name}`} className="btn btn-outline btn-sm">Reply via Email</a>
                  {inq.status==='new'&&<button className="btn btn-ghost btn-sm" onClick={()=>handleMarkRead(inq.id)}>Mark as Read</button>}
                </div>
              </div>
            ))}
          </div>}
        </div>}

        {/* TOURS TAB */}
        {tab==='tours'&&<div>
          {!tours.length?(
            <div style={{textAlign:'center',padding:'60px 20px'}}>
              <div style={{fontSize:40,marginBottom:16}}>🗓️</div>
              <h3 style={{fontSize:26,color:'var(--champagne)',marginBottom:8}}>No tour requests yet</h3>
              <p style={{color:'var(--text-muted)'}}>When couples request a walkthrough from your listing, they'll appear here for you to confirm or decline.</p>
            </div>
          ):<div style={{display:'flex',flexDirection:'column',gap:14}}>
            {tours.map(t=>(
              <div key={t.id} style={{background:'var(--navy)',border:`1px solid ${t.status==='pending'?'var(--gold)':'var(--border)'}`,borderLeft:t.status==='pending'?'3px solid var(--gold)':'1px solid var(--border)',borderRadius:8,padding:'20px 24px'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:8,flexWrap:'wrap',gap:8}}>
                  <div style={{fontFamily:'Cormorant Garamond',fontSize:20,color:'var(--champagne)'}}>{t.couple_name}</div>
                  <span className="badge badge-gold" style={t.status==='confirmed'?{color:'#4ecdc4',borderColor:'rgba(78,205,196,0.4)',background:'rgba(78,205,196,0.1)'}:t.status==='declined'?{color:'#e74c3c',borderColor:'rgba(231,76,60,0.4)',background:'rgba(231,76,60,0.1)'}:{}}>{t.status}</span>
                </div>
                <div style={{display:'flex',gap:20,flexWrap:'wrap',fontSize:12,color:'var(--text-muted)',marginBottom:14}}>
                  <span>🗓️ Requested: {new Date(t.requested_at).toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span>
                  <span>✉️ {t.email}</span>
                  {t.phone&&<span>📞 {t.phone}</span>}
                </div>
                <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
                  {t.status==='pending'&&<button className="btn btn-primary btn-sm" onClick={()=>handleTourStatus(t.id,'confirmed')}>Confirm Tour</button>}
                  {t.status==='pending'&&<button className="btn btn-ghost btn-sm" onClick={()=>handleTourStatus(t.id,'declined')}>Decline</button>}
                  <a href={`mailto:${t.email}?subject=Your tour at ${venue.name}`} className="btn btn-outline btn-sm">Email Couple</a>
                </div>
              </div>
            ))}
          </div>}
        </div>}

        {/* PROFILE TAB */}
        {tab==='profile'&&<div style={{maxWidth:620}}>
          <div style={{background:'var(--navy)',border:'1px solid var(--border)',borderRadius:10,padding:32}}>
            <h3 style={{fontSize:26,marginBottom:24}}>Edit Venue Profile</h3>
            <form onSubmit={handleSaveProfile}>
              <div style={{display:'flex',flexDirection:'column',gap:16}}>
                <div className="field"><label>Description</label><textarea value={profileForm.description} onChange={e=>setProfileForm(f=>({...f,description:e.target.value}))} style={{minHeight:100}}/></div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                  <div className="field"><label>Guest Capacity</label><input type="number" value={profileForm.capacity} onChange={e=>setProfileForm(f=>({...f,capacity:e.target.value}))}/></div>
                  <div className="field"><label>Starting Price ($)</label><input type="number" value={profileForm.price_min} onChange={e=>setProfileForm(f=>({...f,price_min:e.target.value}))}/></div>
                  <div className="field"><label>Price Per Guest ($)</label><input type="number" value={profileForm.price_per_guest} onChange={e=>setProfileForm(f=>({...f,price_per_guest:e.target.value}))} placeholder="125"/></div>
                  <div className="field"><label>Phone</label><input type="tel" value={profileForm.phone} onChange={e=>setProfileForm(f=>({...f,phone:e.target.value}))}/></div>
                  <div className="field"><label>Website</label><input type="url" value={profileForm.website} onChange={e=>setProfileForm(f=>({...f,website:e.target.value}))}/></div>
                </div>
              </div>
              <div style={{marginTop:20}}>
                <div style={{fontSize:11,letterSpacing:'0.14em',textTransform:'uppercase',color:'var(--gold)',marginBottom:12}}>Key Features & Amenities</div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'10px 16px'}}>
                  {AMENITIES.map(a=><label key={a} style={{display:'flex',alignItems:'center',gap:8,fontSize:13,color:'var(--text-muted)',cursor:'pointer'}}><input type="checkbox" checked={(profileForm.amenities||[]).includes(a)} onChange={()=>toggleProfileAmenity(a)} style={{width:'auto',accentColor:'#c9a96e',cursor:'pointer'}}/>{a}</label>)}
                </div>
              </div>
              <button type="submit" className="btn btn-primary" style={{marginTop:24}}>Save Changes</button>
            </form>
          </div>
        </div>}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
//  SHORTLIST / COMPARE PAGE
// ═══════════════════════════════════════════════════════
function ComparePage({setPage,setSelectedVenueId}){
  const toast=useToast();
  const [list,setList]=useState([]);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    const hash=window.location.hash||'';
    const m=hash.match(/compare=([^&]+)/);
    const ids=m?decodeURIComponent(m[1]).split(','):getShortlist();
    if(!ids.length){setLoading(false);return;}
    Promise.all(ids.map(id=>getVenueById(id).catch(()=>null)))
      .then(vs=>setList(vs.filter(Boolean)))
      .finally(()=>setLoading(false));
  },[]);

  function removeVenue(id){
    setShortlist(getShortlist().filter(i=>i!==id));
    setList(l=>l.filter(v=>v.id!==id));
  }
  function share(){
    const url=`${window.location.origin}${window.location.pathname}#compare=${list.map(v=>v.id).join(',')}`;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(()=>toast('✓ Share link copied — send it to your partner or parents!')).catch(()=>window.prompt('Copy this link:',url));
    }else window.prompt('Copy this link:',url);
  }

  if(loading) return <div className="page-loading" style={{marginTop:80}}><div className="spinner"/></div>;

  if(!list.length) return (
    <div style={{textAlign:'center',paddingTop:160,padding:'160px 24px 0'}}>
      <div style={{fontSize:44,marginBottom:16}}>♡</div>
      <h2 style={{fontSize:32,marginBottom:10}}>Your shortlist is empty</h2>
      <p style={{color:'var(--text-muted)',marginBottom:28}}>Tap the ♡ on any venue in search results to save it here and compare your favorites side-by-side.</p>
      <button className="btn btn-primary" onClick={()=>setPage('search')}>Find Venues</button>
    </div>
  );

  const rows=[
    ['Location',v=>`${v.city}, ${v.state}`],
    ['Style',v=>v.style||'—'],
    ['Capacity',v=>v.capacity?`${v.capacity.toLocaleString()} guests`:'—'],
    ['Venue Fee From',v=>v.price_min?`$${v.price_min.toLocaleString()}`:'—'],
    ['Per Guest',v=>v.price_per_guest?`$${v.price_per_guest}`:'—'],
    ['Price Tier',v=>v.price_tier||'—'],
    ['Calendar',v=>isCalVerified(v)?'✓ Verified':'—'],
    ['Top Features',v=>(v.amenities||[]).slice(0,4).join(' · ')||'—'],
  ];

  return (
    <div style={{padding:'100px 0 80px'}}>
      <div className="container">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:28,flexWrap:'wrap',gap:14}}>
          <h1 style={{fontSize:38}}>♥ Your Shortlist</h1>
          <button className="btn btn-outline btn-sm" onClick={share}>🔗 Share with Partner</button>
        </div>
        <div style={{overflowX:'auto'}}>
          <div style={{display:'grid',gridTemplateColumns:`140px repeat(${list.length},minmax(190px,1fr))`,gap:1,background:'var(--border)',border:'1px solid var(--border)',borderRadius:10,overflow:'hidden',minWidth:list.length*200+140}}>
            <div style={{background:'var(--navy)',padding:16}}></div>
            {list.map(v=>{
              const photo=(v.photos&&v.photos[0])||v.photo_url;
              return <div key={v.id} style={{background:'var(--navy)',padding:16,textAlign:'center'}}>
                <div style={{height:90,borderRadius:6,overflow:'hidden',background:'var(--navy-light)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:30,marginBottom:10}}>
                  {photo?<img src={photo} alt={v.name} style={{width:'100%',height:'100%',objectFit:'cover'}}/>:(STYLE_EMOJIS[v.style]||STYLE_EMOJIS.default)}
                </div>
                <div style={{fontFamily:'Cormorant Garamond',fontSize:18,color:'var(--champagne)'}}>{v.name}</div>
              </div>;
            })}
            {rows.map(([label,fn])=>(
              <React.Fragment key={label}>
                <div style={{background:'var(--navy)',padding:'12px 16px',fontSize:11,letterSpacing:'0.1em',textTransform:'uppercase',color:'var(--gold)'}}>{label}</div>
                {list.map(v=><div key={v.id} style={{background:'var(--navy)',padding:'12px 16px',fontSize:13,color:'var(--text-muted)',textAlign:'center'}}>{fn(v)}</div>)}
              </React.Fragment>
            ))}
            <div style={{background:'var(--navy)',padding:16}}></div>
            {list.map(v=>(
              <div key={v.id} style={{background:'var(--navy)',padding:16,display:'flex',gap:8,justifyContent:'center',flexWrap:'wrap'}}>
                <button className="btn btn-primary btn-sm" onClick={()=>{setSelectedVenueId({id:v.id,date:''});setPage('venue');}}>View</button>
                <button className="btn btn-ghost btn-sm" onClick={()=>removeVenue(v.id)}>Remove</button>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════
//  ROOT APP
// ═══════════════════════════════════════════════════════
function App(){
  const [user,setUser]=useState(null);
  const [authLoading,setAuthLoading]=useState(true);
  const [page,setPage]=useState(window.location.hash&&window.location.hash.includes('compare=')?'compare':'home');
  const [searchParams,setSearchParams]=useState({});
  const [selectedVenueInfo,setSelectedVenueInfo]=useState(null);

  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{ setUser(session?.user??null); setAuthLoading(false); });
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{ setUser(session?.user??null); });
    return ()=>subscription.unsubscribe();
  },[]);

  function navigate(p){ setPage(p); window.scrollTo({top:0,behavior:'smooth'}); }

  if(authLoading) return <div className="page-loading"><div className="spinner"/></div>;

  return (
    <AuthCtx.Provider value={{user,loading:authLoading}}>
      <ToastProvider>
        <Nav page={page} setPage={navigate}/>
        {page==='home'&&<HomePage setPage={navigate} setSearchParams={(p)=>{setSearchParams(p);}}/>}
        {page==='search'&&<SearchPage initialParams={searchParams} setPage={navigate} setSelectedVenueId={(info)=>{setSelectedVenueInfo(info);}}/>}
        {page==='venue'&&<VenuePage venueInfo={selectedVenueInfo} setPage={navigate}/>}
        {page==='compare'&&<ComparePage setPage={navigate} setSelectedVenueId={(info)=>{setSelectedVenueInfo(info);}}/>}
        {page==='auth'&&<AuthPage setPage={navigate}/>}
        {page==='register'&&(user?<RegisterVenuePage setPage={navigate}/>:<AuthPage setPage={navigate}/>)}
        {page==='dashboard'&&(user?<DashboardPage setPage={navigate}/>:<AuthPage setPage={navigate}/>)}
      </ToastProvider>
    </AuthCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
